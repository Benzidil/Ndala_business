{% extends 'base.html' %}

{% block title %}Connexion - Ndala Business{% endblock %}

{% block content %}
<div style="padding: 20px;">
    
    <div style="margin-top: 20px; margin-bottom: 30px; text-align: center;">
        <img src="{{ url_for('static', filename='images/logo.jpg') }}" alt="Logo" style="max-width: 80px; height: auto; margin-bottom: 10px;">
        <h2 style="color: var(--primary); margin: 0;">Ravi de vous revoir !</h2>
        <p style="color: #666; font-size: 0.9rem; margin-top: 5px;">Connectez-vous pour retrouver vos avantages.</p>
    </div>

    <form action="/connexion" method="POST" style="background: #fdfdfd; padding: 20px; border-radius: 15px; border: 1px solid #eee;">
        <div style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 6px; font-size: 0.85rem; font-weight: bold; color: #444;">Numéro de téléphone</label>
            <input type="tel" name="telephone" placeholder="Ex: 0812345678" required style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 1rem;">
        </div>

        <div style="margin-bottom: 25px;">
            <label style="display: block; margin-bottom: 6px; font-size: 0.85rem; font-weight: bold; color: #444;">Mot de passe</label>
            <input type="password" name="mot_de_passe" placeholder="Votre mot de passe" required style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 1rem;">
        </div>

        <button type="submit" class="btn-main">Se connecter</button>
    </form>

    <div style="text-align: center; margin-top: 30px;">
        <p style="color: #666; font-size: 0.9rem;">Nouveau sur l'application ? <br>
            <a href="/" style="color: var(--primary); font-weight: bold; text-decoration: none; display: inline-block; margin-top: 8px;">Créer un compte ici</a>
        </p>
    </div>
</div>
{% endblock %}
